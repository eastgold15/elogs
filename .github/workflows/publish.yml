name: publish

# 一次性 workflow:把当前 packages/elogs@2.0.0 直接发到 npm。
# 用 OIDC 信任发布(无需 NPM_TOKEN secret),前提是在 npmjs.com
# 把 @pori15/elogs 的 Trusted Publishers 加上:
#   - Source: GitHub Actions
#   - Repository owner: eastgold15
#   - Repository name: elogs
#   - Workflow filename: publish.yml
# 后续 release 由 .github/workflows/release-please.yml 自动接替,
# 本 workflow 留着作为手动触发 / 紧急重发的入口。
on:
  workflow_dispatch:

# 最低权限:`id-token: write` 是 OIDC 必需
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 装 bun(bun.lock 是 monorepo 用的锁文件)
      - uses: oven-sh/setup-bun@4d6917e68fcd1f2a0a925d67f7f518964f5e1668 # v2
        with:
          bun-version: "1.3"

      # ⚠️ 不要设 registry-url / NODE_AUTH_TOKEN —— OIDC 模式下 npm 走的是
      # 内置的 OIDC token,任何 token 注入都会和它打架
      - name: 安装 monorepo 根依赖(bun workspaces)
        run: bun install --frozen-lockfile

      - name: 编译 elogs 包
        working-directory: packages/elogs
        run: bun run build

      - name: 发布 elogs 到 npm(带 provenance)
        working-directory: packages/elogs
        # `--provenance` 让 npm 用 GitHub Actions 的 OIDC token 验证
        # 身份。无需 NPM_TOKEN —— npmjs.com 那边登记 Trusted Publisher 后
        # 直接放行。
        run: npm publish --provenance --access public
