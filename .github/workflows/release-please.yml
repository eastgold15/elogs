name: release-please

# release-please 监听 main 推送,自动检测 conventional commits 开/更新 Release PR。
# Release PR 合并时,release-please action 内置的 node 策略会自动跑 npm publish。
#
# 当前走 NPMTOKEN secret 路径;若在 npmjs.com 上配了 Trusted Publisher 可改为
# OIDC 路径(只留 `id-token: write`,无需 NPMTOKEN)。
#
# token 放在 https://github.com/eastgold15/elogs/settings/secrets/actions 里,
# 名字: NPMTOKEN,值: `npm token create` 生成的 publish token。
on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发重跑

permissions:
  contents: write       # 推送版本变更提交与 Git 标签
  pull-requests: write  # 开/更新 Release PR
  id-token: write       # npm provenance (即使走 token 也要)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 装 bun
        uses: oven-sh/setup-bun@v2 # v2
        with:
          bun-version: "1.3"

      # release-please action 内部会跑 `npm publish`。
      # 它读 NPM_TOKEN env 来认证 npm registry。
      - name: Release please
        uses: googleapis/release-please-action@v4 # v4
        id: release
        env:
          NPM_TOKEN: ${{ secrets.NPMTOKEN }}
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 打印 release-please 输出(便于排查)
        if: ${{ steps.release.outputs.release_created }}
        env:
          RP_OUT: ${{ toJson(steps.release.outputs) }}
        run: echo "$RP_OUT"
